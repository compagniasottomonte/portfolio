name: Pubblica portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il percorso del progetto
        run: |
          mkdir dist
          cp index.html styles.css talk.css script.js dist/
          cp -R assets dist/assets
          sed -i 's|="/|="/portfolio/|g' dist/index.html
          sed -i "s|'/talk.css'|'/portfolio/talk.css'|g; s|'/assets/|'/portfolio/assets/|g" dist/script.js
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
